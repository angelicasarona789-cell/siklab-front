name: siklab
description: Siklab - Interactive Programming Learning System
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.1.0
  fl_chart: ^0.68.0
  percent_indicator: ^4.2.3
  shared_preferences: ^2.2.3
  provider: ^6.1.1
  http: ^1.2.1
  image_picker: ^1.1.2
  file_picker: ^8.0.3
  socket_io_client: ^2.0.3+1
  screen_protector: ^1.4.2
  audioplayers: ^6.1.0
  pdf: ^3.10.8
  printing: ^5.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.1

dependency_overrides:
  # image 4.11 uses ZLibDecoder.decodeLazy, which is unavailable in Dart 3.11.
  image: 4.10.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/certificate/
    - assets/audio/
